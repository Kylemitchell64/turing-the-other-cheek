name: Keepalive

# Free-tier babysitter. Render spins the API down after ~15 idle minutes and Supabase
# pauses a free project after 7 idle days. /api/health runs SELECT 1 against Postgres, so
# one ping every 10 minutes keeps both awake with no third-party monitor. UptimeRobot is
# still worth having as a second pinger: GitHub disables cron workflows on repos with no
# activity for 60 days, and scheduled runs can be delayed under load.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /api/health
        run: |
          body=$(curl -sS --max-time 90 --retry 2 https://turing-the-other-cheek.onrender.com/api/health)
          echo "$body"
          case "$body" in
            *'"db":true'*)  echo "postgres reachable" ;;
            *'"db":false'*) echo "::warning::API is up but Postgres is unreachable — Supabase project probably paused; restore it at https://supabase.com/dashboard" ;;
            *)              echo "::error::unexpected health body"; exit 1 ;;
          esac
